<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Payslip link unavailable · {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
    <style>
        /* Same rules as the payslip page: standalone, tokens.css only, no
           script. The status word states the outcome before the sentence
           explains it. The copy stays generic on purpose, so the page never
           reveals whether a link expired, was revoked or never existed. */
        body { color: var(--ink); font-family: "Satoshi", var(--font-sans); font-size: 16px;
            line-height: 1.5; margin: 0; min-height: 100vh; }
        .wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: inset 0 4px 0 var(--brand), var(--shadow-sm); display: block; margin: 48px auto;
            max-width: 440px; padding: 36px 24px 32px; text-align: center; }
        .brand-mark { border-radius: var(--radius); box-shadow: none; font-size: 1.3rem; height: 56px; width: 56px; }
        .wrap h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; margin: 0 0 10px; }
        .wrap p { color: var(--ink-soft); line-height: 1.6; margin: 0; }
        .wrap .status-word { color: var(--warn); font-size: 13px; font-weight: 700; letter-spacing: .08em;
            margin: 20px 0 6px; text-transform: uppercase; }
        @media (max-width: 480px) {
            .wrap { margin: 20px 14px; padding: 28px 18px 24px; }
        }
    </style>
</head>
<body class="brand-shell-bg">
<main class="wrap">
    <div class="brand-mark" aria-hidden="true">{{ app_brand_mark }}</div>
    <p class="status-word">Link unavailable</p>
    <h1>This payslip link is no longer valid</h1>
    <p>
        The link may have expired or been mistyped. Please contact your employer's
        payroll office to have your latest payslip sent again.
    </p>
</main>
</body>
</html>
