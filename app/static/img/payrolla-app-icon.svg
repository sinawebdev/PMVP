<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Payrolla">
  <!--
    PAYROLLA APP ICON — 1024 x 1024 (store / PWA master).

    Same master geometry as payrolla-icon.svg, one uniform transform (scale 5.3),
    artwork centred at (512,512). This and favicon.svg carry identical path data
    at different scales, so the 24px tab icon and the 1024px store icon are the
    same shape by construction — nothing was re-drawn for either size.

    Corner radius 229 is 22.37% of 1024, the iOS squircle proportion, so the tile
    matches platform masking instead of being clipped by it. The gradient is the
    bright variant for contrast against the deep-teal tile, still at exactly 45
    degrees. A full-bleed tile (no transparency) is deliberate: app icons are
    composited over unknown wallpapers.
  -->
  <defs>
    <linearGradient id="pai-tile" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D4D4D"/>
      <stop offset="1" stop-color="#062E2E"/>
    </linearGradient>
    <linearGradient id="pai-body" x1="11" y1="119" x2="110" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17C3B2"/>
      <stop offset="1" stop-color="#8FF0E4"/>
    </linearGradient>
    <linearGradient id="pai-leaf" x1="20" y1="82" x2="20" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A4444"/>
      <stop offset="1" stop-color="#12605B"/>
    </linearGradient>
    <linearGradient id="pai-sheen" x1="32" y1="11" x2="32" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="229" fill="url(#pai-tile)"/>
  <g transform="translate(191.35 143.65) scale(5.3)">
    <path d="M23 82C21 100 17 116 11 128C22 117 32 109 40 92Z" fill="url(#pai-leaf)"/>
    <path fill-rule="evenodd" fill="url(#pai-body)"
          d="M32 11H62A48 48 0 0 1 62 107H44A3 3 0 0 0 41 110A9 9 0 0 1 23 110V20A9 9 0 0 1 32 11Z
             M53 29H62A30 30 0 0 1 62 89H53A12 12 0 0 1 41 77V41A12 12 0 0 1 53 29Z"/>
    <path fill-rule="evenodd" fill="url(#pai-sheen)"
          d="M32 11H62A48 48 0 0 1 62 107H44A3 3 0 0 0 41 110A9 9 0 0 1 23 110V20A9 9 0 0 1 32 11Z
             M53 29H62A30 30 0 0 1 62 89H53A12 12 0 0 1 41 77V41A12 12 0 0 1 53 29Z"/>
  </g>
</svg>
