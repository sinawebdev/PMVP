<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Payrolla">
  <!--
    PAYROLLA APP ICON — 1024 x 1024 (store / PWA / desktop installer master).

    Same master geometry as payrolla-icon.svg, one uniform transform (scale 4.5),
    the 116 x 138 artwork's box centred on (512,512). This and favicon.svg carry
    identical path data at different scales, so the tab icon and the 1024px
    store icon are the same shape by construction — nothing was re-drawn for
    either size.

    Corner radius 229 is 22.37% of 1024, the iOS squircle proportion, so the tile
    matches platform masking instead of being clipped by it. The mark takes the
    dark-ground palette (as payrolla-logo-dark.svg) for contrast against the
    deep-teal tile. A full-bleed tile (no transparency) is deliberate: app icons
    are composited over unknown wallpapers.
  -->
  <defs>
    <linearGradient id="pai-tile" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D4D4D"/>
      <stop offset="1" stop-color="#062E2E"/>
    </linearGradient>
    <linearGradient id="pai-front" x1="40.49" y1="133.41" x2="88.63" y2="38.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17C3B2"/>
      <stop offset=".25" stop-color="#4DCFC0"/>
      <stop offset=".5" stop-color="#69DBCD"/>
      <stop offset=".75" stop-color="#7EE6D9"/>
      <stop offset="1" stop-color="#8FF0E4"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="229" fill="url(#pai-tile)"/>
  <g transform="translate(206 156.5) scale(4.5)">
    <path fill="#135F5A" d="M10 98H50A40 50 0 0 1 10 148Z"/>
    <path fill="url(#pai-front)" fill-rule="evenodd" d="M10 10H82A44 44 0 0 1 82 98H10Z M50 50H82A4 4 0 0 1 82 58H50Z"/>
  </g>
</svg>
