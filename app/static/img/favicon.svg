<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Payrolla">
  <!--
    PAYROLLA FAVICON — 24 x 24.

    Not a redraw: the same master geometry as payrolla-icon.svg, placed by one
    uniform transform (scale 0.1242) that lands the 99 x 117 artwork dead-centre
    on the tile at (12,12). The wall thickness scales with it to 2.24 units,
    which still resolves as a solid 2px+ wall at 24px and holds its proportion
    down to 16px. Because this and the 1024px app icon are the identical path
    data under different scales, they are provably the same shape.

    On the tile the palette flips to the bright gradient: the master's #0D4D4D
    start is the tile colour itself, so the deep end would disappear.
  -->
  <defs>
    <linearGradient id="pf-body" x1="11" y1="119" x2="110" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17C3B2"/>
      <stop offset="1" stop-color="#8FF0E4"/>
    </linearGradient>
    <linearGradient id="pf-leaf" x1="20" y1="82" x2="20" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A4444"/>
      <stop offset="1" stop-color="#12605B"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5.4" fill="#0D4D4D"/>
  <g transform="translate(4.486 3.368) scale(0.1242)">
    <path d="M23 82C21 100 17 116 11 128C22 117 32 109 40 92Z" fill="url(#pf-leaf)"/>
    <path fill-rule="evenodd" fill="url(#pf-body)"
          d="M32 11H62A48 48 0 0 1 62 107H44A3 3 0 0 0 41 110A9 9 0 0 1 23 110V20A9 9 0 0 1 32 11Z
             M53 29H62A30 30 0 0 1 62 89H53A12 12 0 0 1 41 77V41A12 12 0 0 1 53 29Z"/>
  </g>
</svg>
