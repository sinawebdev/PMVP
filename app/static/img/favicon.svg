<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Payrolla">
  <!--
    PAYROLLA FAVICON — 24 x 24.

    Not a redraw: the same master geometry as payrolla-icon.svg, placed by one
    uniform transform (scale 0.105) that lands the 116 x 138 artwork's box
    dead-centre on the tile at (12,12).

    One deliberate optical departure: the counter slit opens from 8 to 12 units
    (still centred on the bowl). The master's slit is 0.56px at a 16px tab and
    fills in, leaving a blob with no P in it; at 12 it holds as a line.

    On the tile the palette flips to the dark-ground one: the master's #0D4D4D
    start is the tile colour itself, so the deep end would disappear.
  -->
  <defs>
    <linearGradient id="pf-front" x1="40.49" y1="133.41" x2="88.63" y2="38.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17C3B2"/>
      <stop offset=".5" stop-color="#69DBCD"/>
      <stop offset="1" stop-color="#8FF0E4"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5.4" fill="#0D4D4D"/>
  <g transform="translate(4.86 3.705) scale(0.105)">
    <path fill="#135F5A" d="M10 98H50A40 50 0 0 1 10 148Z"/>
    <path fill="url(#pf-front)" fill-rule="evenodd" d="M10 10H82A44 44 0 0 1 82 98H10Z M50 48H82A6 6 0 0 1 82 60H50Z"/>
  </g>
</svg>
