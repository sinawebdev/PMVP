<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 72" role="img" aria-label="Payrolla">
  <!--
    PAYROLLA PRIMARY HORIZONTAL LOCKUP — icon + wordmark.

    The icon is the identical geometry from payrolla-icon.svg (see that file for
    the full construction notes), placed by a single uniform transform
    (translate + scale 0.4) so it can never drift from the master: the 99 x 117
    artwork becomes 39.6 x 46.8, optically centred on the 72 unit height.
    Nothing is redrawn per-file.

    Wordmark: Satoshi Bold, falling back through Plus Jakarta Sans, Inter and
    SF Pro Display. Kept as live text (not outlines) so that stack can resolve —
    convert to outlines at export if a fixed shape matters more than fallbacks.

    The 228 unit width is sized to the wordmark's advance across that stack
    (measured 193-216 at font-size 42 with letter-spacing -1), leaving padding
    that reads as balanced against the icon. It is the one dimension here that
    depends on which font actually resolves; outlining the text pins it exactly.
  -->
  <defs>
    <linearGradient id="pl-body" x1="11" y1="119" x2="110" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D4D4D"/>
      <stop offset="1" stop-color="#17C3B2"/>
    </linearGradient>
    <linearGradient id="pl-leaf" x1="20" y1="82" x2="20" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#063737"/>
      <stop offset="1" stop-color="#0D4D4D"/>
    </linearGradient>
    <linearGradient id="pl-sheen" x1="32" y1="11" x2="32" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(1.6 8.2) scale(0.4)">
    <path d="M23 82C21 100 17 116 11 128C22 117 32 109 40 92Z" fill="url(#pl-leaf)"/>
    <path fill-rule="evenodd" fill="url(#pl-body)"
          d="M32 11H62A48 48 0 0 1 62 107H44A3 3 0 0 0 41 110A9 9 0 0 1 23 110V20A9 9 0 0 1 32 11Z
             M53 29H62A30 30 0 0 1 62 89H53A12 12 0 0 1 41 77V41A12 12 0 0 1 53 29Z"/>
    <path fill-rule="evenodd" fill="url(#pl-sheen)"
          d="M32 11H62A48 48 0 0 1 62 107H44A3 3 0 0 0 41 110A9 9 0 0 1 23 110V20A9 9 0 0 1 32 11Z
             M53 29H62A30 30 0 0 1 62 89H53A12 12 0 0 1 41 77V41A12 12 0 0 1 53 29Z"/>
  </g>

  <text x="58" y="51"
        font-family="Satoshi,'Plus Jakarta Sans',Inter,'SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1" fill="#0D4D4D">Payrolla</text>
</svg>
