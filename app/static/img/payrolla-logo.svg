<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 72" role="img" aria-label="Payrolla">
  <!--
    PAYROLLA PRIMARY HORIZONTAL LOCKUP — icon + wordmark.

    The icon is the identical geometry from payrolla-icon.svg (see that file for
    the construction notes), placed by a single uniform transform
    (translate + scale 0.34) so it can never drift from the master: the 116 x 138
    artwork becomes 39.4 x 46.9, optically centred on the 72 unit height.
    Nothing is redrawn per-file.

    Wordmark: Satoshi Bold, falling back through Plus Jakarta Sans, Inter and
    SF Pro Display. Kept as live text (not outlines) so that stack can resolve —
    convert to outlines at export if a fixed shape matters more than fallbacks.

    The 228 unit width is sized to the wordmark's advance across that stack
    (measured 193-216 at font-size 42 with letter-spacing -1), leaving padding
    that reads as balanced against the icon. It is the one dimension here that
    depends on which font actually resolves; outlining the text pins it exactly.
  -->
  <defs>
    <linearGradient id="pl-front" x1="40.49" y1="133.41" x2="88.63" y2="38.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D4D4D"/>
      <stop offset=".25" stop-color="#107972"/>
      <stop offset=".5" stop-color="#13978B"/>
      <stop offset=".75" stop-color="#15AFA0"/>
      <stop offset="1" stop-color="#17C3B2"/>
    </linearGradient>
  </defs>

  <g transform="translate(2.6 9.2) scale(0.34)">
    <path fill="#0B4A48" d="M10 98H50A40 50 0 0 1 10 148Z"/>
    <path fill="url(#pl-front)" fill-rule="evenodd" d="M10 10H82A44 44 0 0 1 82 98H10Z M50 50H82A4 4 0 0 1 82 58H50Z"/>
  </g>

  <text x="58" y="51"
        font-family="Satoshi,'Plus Jakarta Sans',Inter,'SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1" fill="#0D4D4D">Payrolla</text>
</svg>
